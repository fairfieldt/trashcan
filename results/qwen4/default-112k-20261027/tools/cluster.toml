# The lab's six Mac Pros, for deploy/trashcan-cluster (Flash-Next 100K check 2026-10-27). Engine and runs in ~/trashcan-exp/a16.
[cluster]
workspace = "~/trashcan-exp/a16"
binary = "trashcan"
models = "~/models"
run_dir = "~/trashcan-exp/a16/runs"
state = "/Users/fairfieldt/dev/claude-work/flashnext-100k-20261027/state"
manifest = "/Users/fairfieldt/dev/claude-work/flashnext-100k-20261027/main/deploy/manifest.toml"
recipes = "/Users/fairfieldt/dev/claude-work/flashnext-100k-20261027/main/deploy/recipes.toml"

[ports]
serve = 8000
tp_node = 7072
qwen4_node = 7071

[[node]]
name = "incite"
lan = "incite.tdf.sh"   # TCP fallback address (tailnet)
index = 1
[[node]]
name = "invite"
lan = "invite.tdf.sh"   # TCP fallback address (tailnet)
index = 2
[[node]]
name = "indite"
lan = "indite.tdf.sh"   # TCP fallback address (tailnet)
index = 3
[[node]]
name = "enlight"
lan = "enlight.tdf.sh"   # TCP fallback address (tailnet)
index = 4
[[node]]
name = "inflight"
lan = "inflight.tdf.sh"   # TCP fallback address (tailnet)
index = 5
[[node]]
name = "alight"
lan = "alight.tdf.sh"   # TCP fallback address (tailnet)
index = 6

# The ring as recabled on 2026-10-27 (incite-inflight on bus 2 at both ends).
[[cable]]
ends = ["incite:2", "inflight:2"]
[[cable]]
ends = ["inflight:1", "alight:1"]
[[cable]]
ends = ["alight:0", "indite:0"]
[[cable]]
ends = ["indite:1", "invite:1"]
[[cable]]
ends = ["invite:0", "enlight:0"]
[[cable]]
ends = ["enlight:1", "incite:1"]
