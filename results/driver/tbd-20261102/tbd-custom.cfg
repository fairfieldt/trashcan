# One-time boot for the userspace Thunderbolt driver (tbd) work: IOMMU on (host devices identity-mapped),
# vfio-pci leaves idle devices in D0. Boot it once with: sudo grub-reboot tbd-iommu
menuentry "Debian GNU/Linux, with Linux 7.3.0-rc7-p2p, IOMMU for VFIO (tbd)" --id tbd-iommu {
	load_video
	insmod gzio
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root f5ad8741-67fd-4764-94cb-ef3889feef03
	linux	/boot/vmlinuz-7.3.0-rc7-p2p root=UUID=f5ad8741-67fd-4764-94cb-ef3889feef03 ro quiet radeon.si_support=0 amdgpu.si_support=1 panic=10 intel_iommu=on iommu=pt vfio_pci.disable_idle_d3=1
	initrd	/boot/initrd.img-7.3.0-rc7-p2p
}
