# One-time boot for the userspace GPU driver (gpud) work: IOMMU on (host devices identity-mapped),
# vfio-pci leaves idle devices in D0. Boot it once with: sudo grub-reboot gpud-iommu
menuentry "Debian GNU/Linux, with Linux 7.3.0-rc7-p2p, IOMMU for VFIO (gpud)" --id gpud-iommu {
	load_video
	insmod gzio
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root 31047b5f-d694-4c4d-8a41-82aa1f7abc6a
	linux	/vmlinuz-7.3.0-rc7-p2p root=/dev/mapper/incite--vg-root ro quiet radeon.si_support=0 amdgpu.si_support=1 panic=10 intel_iommu=on iommu=pt vfio_pci.disable_idle_d3=1
	initrd	/initrd.img-7.3.0-rc7-p2p
}
