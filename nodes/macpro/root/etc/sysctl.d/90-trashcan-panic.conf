# Reboot 10 s after a panic; turn NMI-watchdog hard lockups and soft lockups into panics.
# Apple firmware disables the iTCO hardware watchdog (NO_REBOOT), so this is the only auto-recovery.
kernel.panic = 10
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
# Send info-level kernel messages to the consoles.
kernel.printk = 7 4 1 7
# Panic (and reboot after kernel.panic seconds) on any oops instead of running on with a broken kernel.
kernel.panic_on_oops = 1
