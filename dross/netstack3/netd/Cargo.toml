[package]
name = "oscar-netd"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "unix-netd"
path = "src/main.rs"
test = false
bench = false

[dependencies]
oscar-netstack3-engine = { path = "../engine" }
oscar-resolver = { path = "../resolver" }
