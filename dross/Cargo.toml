# dross is its own workspace. `boot` builds for x86_64-unknown-uefi and `kernel` for x86_64-unknown-none
# (dross/build.sh); the library crates also build and test on the host.
[workspace]
members = ["bootinfo", "abi", "acpi", "pmm", "boot", "kernel", "user/rt", "user/init", "user/selftest", "user/pcid", "user/edutest", "user/usbd"]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = "line-tables-only"
