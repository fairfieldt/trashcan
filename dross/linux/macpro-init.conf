# init.conf for a first boot on a Mac Pro 6,1: probe every device the drivers support, without changing them
# (read-only probes), and log what they see. Addresses as on incite.
check gpud 0 probe --read-only 0000:02:00.0
check gpud 0 probe --read-only 0000:06:00.0
check tbd 0 probe 0000:16:00.0
check ethd 0 probe 0000:0c:00.0
