# init.conf for a Mac Pro 6,1 test boot (the cable on the second Ethernet port): the kernel log goes to the LAN
# first (UDP broadcast to port 6666, driver/ethd/netlog-listen.py; add --ip, --to and --to-mac for receivers that
# drop broadcasts from 0.0.0.0), then read-only probes of the D700s and a Thunderbolt controller, then a reset back
# to Linux (dross is booted with grub-reboot).
start ethd netlog 0000:0c:00.0
sleep 8000
check gpud 0 probe --read-only 0000:02:00.0
check gpud 0 probe --read-only 0000:06:00.0
check tbd 0 probe 0000:16:00.0
sleep 5000
reboot
