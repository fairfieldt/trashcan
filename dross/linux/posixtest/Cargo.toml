[package]
name = "posixtest"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Checks dross's Linux interface with an ordinary Rust std program (static, musl)"

[dependencies]
libc = "0.2"
dross-rt = { path = "../../user/rt", default-features = false }
dross-abi = { path = "../../abi" }

# Its own workspace: dross's profiles abort on panic, and this checks unwinding.
[workspace]
