# init.conf for QEMU runs (run-qemu.sh): Linux programs to check. The drivers' probes open QEMU's edu device
# through pcid (it is at 00:02.0) and must refuse it by its IDs.
check posixtest 0 --check
check ethd 1 probe 0000:00:02.0
check tbd 1 probe 0000:00:02.0
check gpud 1 probe --read-only 0000:00:02.0
check ethd 1 netlog 0000:00:02.0
