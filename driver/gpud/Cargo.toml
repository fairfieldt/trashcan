[package]
name = "gpud"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Userspace AMDGPU driver server for the Mac Pro 6,1's FirePro D700s (Tahiti)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gpud-platform = { path = "../platform" }

[build-dependencies]
cc = "1"
