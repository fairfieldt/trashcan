[package]
name = "trashcan"
version = "0.1.0"
edition = "2021"
description = "LLM inference on Mac Pro 6,1 FirePro D700s over Vulkan, across GPUs and machines"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
ash = { version = "0.38.0", features = ["loaded"] }
bytemuck = "1.25.2"
clap = { version = "4.6.7", features = ["derive"] }
half = "2.7.1"
# Already in the tree through memmap2; used directly for O_DIRECT, fadvise and madvise in the n-gram table reader.
libc = "0.2"
# Streams of tbd, the userspace Thunderbolt driver, run in this process (driver/tbd-client).
tbd-client = { path = "../driver/tbd-client" }
# CRC32C of link records (SSE4.2 crc32 instructions on the Mac Pros).
crc32c = "0.6"
memmap2 = "0.9.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["builtins", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
tiny_http = "0.12"
fancy-regex = "0.19.2"
