# Pinned artifacts for the published recipes (deploy/recipes.toml). deploy/trashcan-cluster checks every node
# against this file before a launch: kernel, VBIOS, Mesa, engine binary and model files (size and sha256).

[hardware]
model = "Mac Pro 6,1"
vbios = ["113-C3861XA-028", "113-C3861XB-028"]   # one D700 each; both the same means patch 0001 is missing
vram_mib_min = 6000

[kernel]
# Linux 7.3-rc7 with kernel/patches-7.3 and kernel/configs/7.3.0-rc7-p2p.config, built by kernel/build-7.3.sh
# (docs/kernel.md). The package version ends in +psID, the patch set's id: the first 8 hex digits of the sha256 of
# `sha256sum` over the set's patch files, in order.
source = "https://git.kernel.org/torvalds/t/linux-7.3-rc7.tar.gz"
source_sha256 = "f789fc0d7b3713b6be23284f2a9c35bf41fb86785b24cfcc506c20d8ff712523"
config = "kernel/configs/7.3.0-rc7-p2p.config"
config_sha256 = "f32b60c742085128277e7e062910284fe04fe0ae16965f3f8853c63e9a7a3d48"
# /boot/config-RELEASE without its CONFIG_LOCALVERSION line, as the build leaves it (olddefconfig changes nothing).
config_sha256_normalized = "85af39e70d0e07b2eb3c6cc86f8a48861847523432a36d7c21562aac7fa6aa5e"

[kernel.patches]
"0001-amdgpu-vfct-exact-match-first.patch" = "f8a661ae983ad87f9d8af5e0baa601864bdaa9c94d6cec479b84d2515bcad82b"
"0003-p2pdma-whitelist-ivy-bridge-ep.patch" = "1d454a2768b3f3080b22ed22f7b9bb574e24f704ceaa640e6e8b8e4cbbc193ec"
"0004-thunderbolt-net-throttling-param.patch" = "4a067fbf2596c41eae986c569ac6dd5e016cf07f37a450aaf1116d3b6114b5b5"
"0005-thunderbolt-stream-no-tx-e2e.patch" = "7ac929ca3fc2bf41d9e2f060802618be40844882dd88a0fc5d35bf15ff53b407"
"0006-thunderbolt-stream-io-after-close.patch" = "6efd668122c4f65bb1c8911573f6d4258f5e24bf2d5d931df720ee09df03d33f"
"0007-thunderbolt-stream-no-rx-flush-on-close.patch" = "53c992748a785c83b928b72b85fcb525a23fd3be633e709e4eadeaf2ee762314"
"0009-applesmc-mac-pro-port-lights.patch" = "f807301d43b68720528855a7246c58fafa5ca44e709d2de49efdd7c4381e76aa"
"0010-applesmc-port-lights-levels.patch" = "fdd4c0f179e6adba5ad01d0f5d65af2184e70e658f5f9bda0031c07cfe1f0342"

# KSET=engine (0001, 0003-0007) builds 7.3.0-rc7-p2p; KSET=lights (all of the above) builds 7.3.0-rc7-p2p-lights.
[kernel.patchsets.engine]
id = "9c9a5449"
release = "7.3.0-rc7-p2p"
patches = ["0001", "0003", "0004", "0005", "0006", "0007"]
# The code of these patches is what ran in every published measurement (as 7.3.0-rc7-p2p-s2, below). The package
# 7.3.0~rc7-1p2p+ps9c9a5449 booted on one Mac (2026-10-26): install-kernel.sh verify and the 1-Mac smokes passed;
# the 6-Mac smoke passed 3 of 4 runs, the failure coinciding with a TCP fallback between two Macs on -s2. The other
# Macs still run -s2.
status = "qualified on one node"

[kernel.patchsets.lights]
id = "86bb27d4"
release = "7.3.0-rc7-p2p-lights"
patches = ["0001", "0003", "0004", "0005", "0006", "0007", "0009", "0010"]
status = "not qualified as a kernel: 0009/0010 run as an applesmc module (lights/driver.sh, docs/lights.md)"

# Kernels known by release name. 7.3.0-rc7-p2p-s2 is the build that ran the published measurements (rolled out to
# six Macs 2026-10-14): the engine patch set (0004 differs only in its description line) and this config.
[kernel.accepted."7.3.0-rc7-p2p-s2"]
patchset = "engine"
status = "qualified"
image = "linux-image-7.3.0-rc7-p2p-s2_7.3.0~rc7-3p2p_amd64.deb"
image_sha256 = "a91c727d0b5720bf4f71ed5b98e58a333c21ba18820ae626e7786b56fdf44bdb"
headers = "linux-headers-7.3.0-rc7-p2p-s2_7.3.0~rc7-3p2p_amd64.deb"
headers_sha256 = "bbcea1ad2c036720d585002d70f1b5abc835662b53ed09fdde880e23613cb86a"

[mesa]
package = "mesa-vulkan-drivers"
version = "25.0.7-2+deb13u1"   # Debian 13; Flash-Next's light barriers were audited on this version

[engine]
# The engine is built from this repository on every node (or once and copied); every node must run the same
# binary. Set binary_sha256 to pin one build.
binary_sha256 = ""

